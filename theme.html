<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    /* =========================
       BASE
    ========================= */

    * {
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #000;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;

      color: white;
    }


    /* =========================
       FOND FLOUTÉ DE LA POCHETTE
    ========================= */

    #background {
      position: fixed;

      top: -12%;
      left: -12%;

      width: 124%;
      height: 124%;

      background-size: cover;
      background-position: center;

      filter:
        blur(55px)
        saturate(135%);

      transform: scale(1.08);

      opacity: 0.72;

      z-index: 0;

      transition:
        background-image 0.7s ease;
    }


    /* =========================
       COUCHE SOMBRE
    ========================= */

    #background-overlay {
      position: fixed;

      inset: 0;

      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.28),
          rgba(0, 0, 0, 0.60)
        );

      z-index: 1;
    }


    /* =========================
       VIGNETTE
    ========================= */

    #vignette {
      position: fixed;

      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          transparent 18%,
          rgba(0, 0, 0, 0.40) 100%
        );

      z-index: 2;
    }


    /* =========================
       PLAYER
    ========================= */

    #player {
      position: relative;

      z-index: 3;

      width: 100%;
      height: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 16px;

      padding: 24px;

      opacity: 0;

      transform:
        translateY(8px);

      transition:
        opacity 0.4s ease,
        transform 0.4s ease;
    }


    #player.visible {
      opacity: 1;

      transform:
        translateY(0);
    }


    /* =========================
       LIQUID GLASS — SHINY
    ========================= */

    .glass {
      position: relative;

      overflow: hidden;

      /*
        Plusieurs couches créent
        une impression de profondeur.
      */

      background:

        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.14) 0%,
          rgba(255, 255, 255, 0.065) 28%,
          rgba(255, 255, 255, 0.025) 55%,
          rgba(255, 255, 255, 0.07) 100%
        );

      /*
        Le fond reste visible
        mais paraît déformé / diffus.
      */

      backdrop-filter:
        blur(30px)
        saturate(155%)
        brightness(1.08);

      -webkit-backdrop-filter:
        blur(30px)
        saturate(155%)
        brightness(1.08);

      /*
        Bord lumineux du verre.
      */

      border:

        1px solid
        rgba(255, 255, 255, 0.28);

      /*
        Profondeur extérieure
        + lumière intérieure.
      */

      box-shadow:

        0 20px 50px
        rgba(0, 0, 0, 0.48),

        0 4px 16px
        rgba(0, 0, 0, 0.18),

        inset
        0 1px 1px
        rgba(255, 255, 255, 0.34),

        inset
        0 -1px 1px
        rgba(255, 255, 255, 0.035);
    }


    /* =========================
       GRAND REFLET SUPÉRIEUR
    ========================= */

    .glass::before {
      content: "";

      position: absolute;

      top: -45%;
      left: -20%;

      width: 140%;
      height: 90%;

      pointer-events: none;

      border-radius: 50%;

      background:

        radial-gradient(
          ellipse at center,
          rgba(255, 255, 255, 0.18) 0%,
          rgba(255, 255, 255, 0.075) 28%,
          transparent 68%
        );

      filter:
        blur(10px);

      opacity: 0.8;

      z-index: 0;
    }


    /* =========================
       REFLET DIAGONAL
    ========================= */

    .glass::after {
      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      border-radius: inherit;

      background:

        linear-gradient(
          125deg,

          rgba(255, 255, 255, 0.16) 0%,

          rgba(255, 255, 255, 0.045) 18%,

          transparent 40%,

          rgba(255, 255, 255, 0.025) 70%,

          rgba(255, 255, 255, 0.09) 100%
        );

      opacity: 0.7;

      z-index: 1;
    }


    /* =========================
       CONTENU AU-DESSUS
    ========================= */

    .glass > * {
      position: relative;

      z-index: 2;
    }


    /* =========================
       PANNEAU POCHETTE
       PROPORTIONS COMPACTES
    ========================= */

    #artwork-panel {
      width:
        min(27vw, 310px);

      aspect-ratio: 1 / 1;

      padding: 18px;

      border-radius: 30px;

      display: flex;

      align-items: center;
      justify-content: center;
    }


    /* =========================
       POCHETTE
    ========================= */

    #artwork {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      border-radius: 18px;

      opacity: 0;

      transform:
        scale(0.98);

      transition:
        opacity 0.4s ease,
        transform 0.4s ease;

      box-shadow:

        0 14px 32px
        rgba(0, 0, 0, 0.52),

        inset
        0 1px 0
        rgba(255, 255, 255, 0.10);
    }


    #artwork.loaded {
      opacity: 1;

      transform:
        scale(1);
    }


    /* =========================
       PANNEAU INFORMATIONS
    ========================= */

    #info-panel {
      width:
        min(27vw, 310px);

      border-radius: 26px;

      padding:
        20px
        22px
        18px;

      text-align: center;
    }


    /* =========================
       TITRE
    ========================= */

    #title {
      color: #fff;

      font-size:
        clamp(18px, 1.6vw, 25px);

      font-weight: 700;

      letter-spacing:
        -0.02em;

      line-height: 1.2;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      text-shadow:

        0 2px 12px
        rgba(0, 0, 0, 0.28);
    }


    /* =========================
       ARTISTE
    ========================= */

    #artist {
      margin-top: 6px;

      color:

        rgba(
          255,
          255,
          255,
          0.68
        );

      font-size:
        clamp(14px, 1.1vw, 17px);

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      text-shadow:

        0 2px 10px
        rgba(0, 0, 0, 0.20);
    }


    /* =========================
       PROGRESSION
    ========================= */

    #progress-container {
      margin-top: 18px;

      width: 100%;
    }


    #progress-track {
      position: relative;

      width: 100%;
      height: 4px;

      border-radius: 999px;

      background:

        rgba(
          255,
          255,
          255,
          0.20
        );

      overflow: visible;

      box-shadow:

        inset
        0 1px 2px
        rgba(0, 0, 0, 0.20);
    }


    #progress-fill {
      width: 0%;
      height: 100%;

      border-radius: inherit;

      background:

        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.78),
          rgba(255, 255, 255, 1)
        );

      box-shadow:

        0 0 8px
        rgba(255, 255, 255, 0.22);

      transition:
        width 0.4s linear;
    }


    #progress-thumb {
      position: absolute;

      top: 50%;
      left: 0%;

      width: 10px;
      height: 10px;

      border-radius: 50%;

      background:

        linear-gradient(
          135deg,
          #fff,
          rgba(255, 255, 255, 0.78)
        );

      transform:
        translate(-50%, -50%);

      box-shadow:

        0 2px 8px
        rgba(0, 0, 0, 0.28),

        0 0 10px
        rgba(255, 255, 255, 0.25);

      transition:
        left 0.4s linear;
    }


    /* =========================
       TEMPS
    ========================= */

    #time-row {
      display: flex;

      justify-content:
        space-between;

      margin-top: 8px;

      color:

        rgba(
          255,
          255,
          255,
          0.62
        );

      font-size: 12px;

      font-variant-numeric:
        tabular-nums;

      text-shadow:

        0 1px 6px
        rgba(0, 0, 0, 0.20);
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 900px) {

      #artwork-panel,
      #info-panel {

        width:
          min(42vw, 310px);

      }

    }


    @media (max-width: 600px) {

      #player {
        gap: 14px;
      }


      #artwork-panel {

        width:
          min(70vw, 290px);

        padding: 16px;

        border-radius: 26px;
      }


      #info-panel {

        width:
          min(70vw, 290px);

      }

    }

  </style>

</head>


<body>


  <!-- =========================
       FOND FLOUTÉ
  ========================= -->

  <div id="background"></div>

  <div id="background-overlay"></div>

  <div id="vignette"></div>



  <!-- =========================
       PLAYER
  ========================= -->

  <div id="player">


    <!-- =========================
         PANNEAU POCHETTE
    ========================= -->

    <div
      id="artwork-panel"
      class="glass"
    >

      <img
        id="artwork"
        src=""
        alt="Pochette"
      >

    </div>



    <!-- =========================
         PANNEAU INFORMATIONS
    ========================= -->

    <div
      id="info-panel"
      class="glass"
    >


      <!-- TITRE -->

      <div id="title">
        En attente...
      </div>



      <!-- ARTISTE -->

      <div id="artist"></div>



      <!-- PROGRESSION -->

      <div id="progress-container">


        <div id="progress-track">


          <div
            id="progress-fill"
          ></div>


          <div
            id="progress-thumb"
          ></div>


        </div>



        <!-- TEMPS -->

        <div id="time-row">


          <span id="current-time">
            0:00
          </span>


          <span id="duration">
            0:00
          </span>


        </div>


      </div>


    </div>


  </div>



  <script>


    /* =========================
       ÉLÉMENTS
    ========================= */

    const player =
      document.getElementById(
        'player'
      );


    const background =
      document.getElementById(
        'background'
      );


    const artwork =
      document.getElementById(
        'artwork'
      );


    const title =
      document.getElementById(
        'title'
      );


    const artist =
      document.getElementById(
        'artist'
      );


    const progressFill =
      document.getElementById(
        'progress-fill'
      );


    const progressThumb =
      document.getElementById(
        'progress-thumb'
      );


    const currentTimeElement =
      document.getElementById(
        'current-time'
      );


    const durationElement =
      document.getElementById(
        'duration'
      );



    /* =========================
       ÉTAT
    ========================= */

    let currentArtwork = '';

    let trackPosition = 0;

    let trackDuration = 0;

    let positionUpdatedAt =
      Date.now();



    /* =========================
       FORMAT DU TEMPS
    ========================= */

    function formatTime(seconds) {

      seconds =
        Math.max(
          0,
          Math.floor(
            Number(seconds) || 0
          )
        );


      const minutes =
        Math.floor(
          seconds / 60
        );


      const remainingSeconds =
        seconds % 60;


      return (

        minutes

        +

        ':'

        +

        String(
          remainingSeconds
        ).padStart(
          2,
          '0'
        )

      );

    }



    /* =========================
       NORMALISATION
       SECONDES / MILLISECONDES
    ========================= */

    function normalizeTime(value) {

      const number =
        Number(value) || 0;


      if (number > 10000) {

        return number / 1000;

      }


      return number;

    }



    /* =========================
       MISE À JOUR POCHETTE
       + FOND FLOUTÉ
    ========================= */

    function updateArtwork(url) {

      if (
        !url ||
        url === currentArtwork
      ) {

        return;

      }


      currentArtwork = url;


      artwork.classList.remove(
        'loaded'
      );


      const image =
        new Image();


      image.onload = () => {


        /* Pochette principale */

        artwork.src =
          url;



        /*
          Même image utilisée
          pour le fond.
        */

        background.style.backgroundImage =

          `url("${url}")`;



        requestAnimationFrame(
          () => {

            artwork.classList.add(
              'loaded'
            );

          }
        );

      };


      image.onerror = () => {

        console.error(
          'Impossible de charger la pochette.'
        );

      };


      image.src =
        url;

    }



    /* =========================
       POSITION ACTUELLE
    ========================= */

    function getCurrentPosition() {

      if (
        trackDuration <= 0
      ) {

        return 0;

      }


      const elapsed =

        (
          Date.now()
          -
          positionUpdatedAt
        )

        / 1000;


      return Math.min(

        trackDuration,

        trackPosition
        +
        elapsed

      );

    }



    /* =========================
       AFFICHAGE PROGRESSION
    ========================= */

    function renderProgress() {

      const position =
        getCurrentPosition();


      let percentage = 0;


      if (
        trackDuration > 0
      ) {

        percentage =

          Math.min(

            100,

            Math.max(

              0,

              (
                position
                /
                trackDuration
              )

              *
              100

            )

          );

      }


      progressFill.style.width =

        percentage + '%';


      progressThumb.style.left =

        percentage + '%';


      currentTimeElement.textContent =

        formatTime(
          position
        );


      durationElement.textContent =

        formatTime(
          trackDuration
        );

    }



    /* =========================
       MISE À JOUR MORCEAU
    ========================= */

    function updateTrack(data) {

      if (!data) {

        return;

      }


      /* TITRE */

      title.textContent =

        data.title

        ||

        'Titre inconnu';



      /* ARTISTE */

      artist.textContent =

        data.artist

        ||

        '';



      /* POCHETTE */

      const cover =

        data.coverUrl

        ||

        data.artwork

        ||

        '';


      if (cover) {

        updateArtwork(
          cover
        );

      }



      /* POSITION */

      const rawPosition =

        data.position

        ??

        data.currentTime

        ??

        data.elapsed

        ??

        data.progress

        ??

        0;



      /* DURÉE */

      const rawDuration =

        data.duration

        ??

        data.totalDuration

        ??

        data.length

        ??

        0;


      const newDuration =

        normalizeTime(
          rawDuration
        );


      const newPosition =

        normalizeTime(
          rawPosition
        );


      if (
        newDuration > 0
      ) {

        trackDuration =
          newDuration;


        trackPosition =
          newPosition;


        positionUpdatedAt =
          Date.now();


        renderProgress();

      }


      player.classList.add(
        'visible'
      );

    }



    /* =========================
       ANIMATION PROGRESSION
    ========================= */

    setInterval(

      renderProgress,

      500

    );



    /* =========================
       CHARGEMENT INITIAL
    ========================= */

    fetch(
      '/api/now-playing'
    )

      .then(

        response =>
          response.json()

      )

      .then(

        updateTrack

      )

      .catch(

        error => {

          console.error(
            'Erreur now-playing :',
            error
          );

        }

      );



    /* =========================
       STREAM EN DIRECT
    ========================= */

    function connectStream() {

      const eventSource =

        new EventSource(
          '/api/stream'
        );


      eventSource.addEventListener(

        'track',

        event => {

          try {

            const data =

              JSON.parse(
                event.data
              );


            updateTrack(
              data
            );

          }

          catch (error) {

            console.error(
              'Erreur SSE :',
              error
            );

          }

        }

      );


      eventSource.onerror = () => {

        eventSource.close();


        setTimeout(

          connectStream,

          2000

        );

      };

    }


    connectStream();


  </script>

</body>
</html>
