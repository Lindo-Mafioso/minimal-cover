<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Minimal Cover</title>

<style>

/* =========================================
   RESET
========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}


/* =========================================
   VARIABLES
========================================= */

:root {

    --text: rgba(255, 255, 255, 0.96);

    --secondary-text: rgba(255, 255, 255, 0.68);

    --glass:
        rgba(35, 35, 38, 0.50);

    --glass-deep:
        rgba(12, 12, 14, 0.58);

    --border:
        rgba(255, 255, 255, 0.24);

    --border-soft:
        rgba(255, 255, 255, 0.10);

}


/* =========================================
   PAGE
========================================= */

body {

    background: #000;

    font-family:

        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Helvetica,
        Arial,
        sans-serif;

}


/* =========================================
   FOND FLOU
========================================= */

.background {

    position: fixed;

    inset: -80px;

    z-index: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(255, 255, 255, 0.04),
            rgba(0, 0, 0, 0.82)
        );

    overflow: hidden;

}


.background-image {

    position: absolute;

    inset: -80px;

    width: calc(100% + 160px);

    height: calc(100% + 160px);

    object-fit: cover;

    opacity: 0;

    filter:
        blur(55px)
        saturate(1.25)
        brightness(0.62);

    transform: scale(1.12);

    transition:

        opacity 1.2s ease,

        transform 1.5s ease;

}


.background-image.visible {

    opacity: 0.72;

    transform: scale(1.18);

}


/* Couche sombre
   pour conserver la lisibilité */

.background-overlay {

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            180deg,

            rgba(0, 0, 0, 0.26) 0%,

            rgba(0, 0, 0, 0.56) 100%
        );

}


/* =========================================
   CONTENEUR
========================================= */

.stage {

    position: relative;

    z-index: 2;

    width: 100%;

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

}


/* =========================================
   CARTE LIQUID GLASS
========================================= */

.player {

    position: relative;

    width: min(720px, 88vw);

    min-height: 225px;

    display: flex;

    align-items: center;

    gap: 24px;

    padding:

        22px 26px 22px 22px;

    border-radius: 34px;

    overflow: hidden;


    /* VERRE */

    background:

        linear-gradient(
            135deg,

            rgba(255, 255, 255, 0.13) 0%,

            rgba(255, 255, 255, 0.055) 28%,

            rgba(255, 255, 255, 0.025) 58%,

            rgba(0, 0, 0, 0.10) 100%
        ),

        var(--glass-deep);


    backdrop-filter:

        blur(28px)

        saturate(1.35);


    -webkit-backdrop-filter:

        blur(28px)

        saturate(1.35);


    border:

        1px solid var(--border);


    box-shadow:

        0 24px 70px
        rgba(0, 0, 0, 0.42),

        inset
        0 1px 0
        rgba(255, 255, 255, 0.20),

        inset
        0 -1px 0
        rgba(0, 0, 0, 0.20);

}


/* =========================================
   REFLET LIQUIDE
========================================= */

.player::before {

    content: "";

    position: absolute;

    pointer-events: none;

    inset: 0;

    border-radius: inherit;


    background:

        linear-gradient(
            120deg,

            rgba(255, 255, 255, 0.15) 0%,

            rgba(255, 255, 255, 0.045) 22%,

            transparent 46%
        );


    opacity: 0.72;

}


/* Reflet supérieur subtil */

.player::after {

    content: "";

    position: absolute;

    pointer-events: none;

    top: 0;

    left: 8%;

    width: 50%;

    height: 1px;


    background:

        linear-gradient(
            90deg,

            transparent,

            rgba(255, 255, 255, 0.42),

            transparent
        );


    opacity: 0.65;

}


/* =========================================
   POCHETTE
========================================= */

.cover-container {

    position: relative;

    flex: 0 0 auto;

    width: 176px;

    height: 176px;

    border-radius: 24px;

    overflow: hidden;


    background:

        rgba(0, 0, 0, 0.32);


    border:

        1px solid
        rgba(255, 255, 255, 0.16);


    box-shadow:

        0 14px 32px
        rgba(0, 0, 0, 0.32),

        inset
        0 1px 0
        rgba(255, 255, 255, 0.10);

}


.cover {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;

    opacity: 0;

    transform: scale(1.03);

    transition:

        opacity 0.45s ease,

        transform 0.65s ease;

}


.cover.visible {

    opacity: 1;

    transform: scale(1);

}


/* Petit reflet sur la pochette */

.cover-container::after {

    content: "";

    position: absolute;

    pointer-events: none;

    inset: 0;

    border-radius: inherit;


    background:

        linear-gradient(
            135deg,

            rgba(255, 255, 255, 0.13),

            transparent 36%
        );

}


/* =========================================
   INFORMATIONS
========================================= */

.info {

    position: relative;

    z-index: 2;

    flex: 1;

    min-width: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

}


/* =========================================
   TITRE
========================================= */

.title {

    color: var(--text);

    font-size: 30px;

    font-weight: 700;

    letter-spacing: -0.7px;

    line-height: 1.12;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    text-shadow:

        0 2px 14px
        rgba(0, 0, 0, 0.25);

}


/* =========================================
   ARTISTE
========================================= */

.artist {

    margin-top: 7px;

    color: var(--secondary-text);

    font-size: 19px;

    font-weight: 450;

    letter-spacing: -0.2px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* =========================================
   ESPACE
========================================= */

.spacer {

    height: 28px;

}


/* =========================================
   PROGRESSION
========================================= */

.progress-area {

    width: 100%;

}


.progress-track {

    position: relative;

    width: 100%;

    height: 5px;

    border-radius: 999px;

    overflow: hidden;


    background:

        rgba(255, 255, 255, 0.17);


    box-shadow:

        inset
        0 1px 2px
        rgba(0, 0, 0, 0.18);

}


.progress-fill {

    position: absolute;

    inset:

        0 auto 0 0;

    width: 0%;

    border-radius: inherit;


    background:

        linear-gradient(
            90deg,

            rgba(255, 255, 255, 0.94),

            rgba(255, 255, 255, 0.72)
        );


    box-shadow:

        0 0 12px
        rgba(255, 255, 255, 0.16);

}


/* Curseur */

.progress-knob {

    position: absolute;

    top: 50%;

    left: 0%;

    width: 13px;

    height: 13px;

    border-radius: 50%;

    transform:

        translate(-50%, -50%);


    background:

        rgba(255, 255, 255, 0.96);


    box-shadow:

        0 2px 8px
        rgba(0, 0, 0, 0.28);

}


/* =========================================
   TEMPS
========================================= */

.time-row {

    margin-top: 10px;

    display: flex;

    justify-content: space-between;

    align-items: center;


    color:

        rgba(255, 255, 255, 0.64);


    font-size: 14px;

    font-weight: 500;

    letter-spacing: 0.1px;

}


/* =========================================
   ANIMATION CHANGEMENT DE TITRE
========================================= */

.player.changed {

    animation:

        playerPulse
        0.65s ease;

}


@keyframes playerPulse {

    0% {

        transform:
            scale(0.985);

        opacity:
            0.82;

    }


    100% {

        transform:
            scale(1);

        opacity:
            1;

    }

}


/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 620px) {

    .player {

        width: 90vw;

        gap: 18px;

        padding:

            18px;

        border-radius: 28px;

    }


    .cover-container {

        width: 130px;

        height: 130px;

        border-radius: 20px;

    }


    .title {

        font-size: 23px;

    }


    .artist {

        font-size: 16px;

    }


    .spacer {

        height: 20px;

    }

}


@media (max-width: 460px) {

    .player {

        flex-direction: column;

        align-items: stretch;

    }


    .cover-container {

        width: 100%;

        height: auto;

        aspect-ratio: 1 / 1;

    }

}

</style>
</head>


<body>


<!-- =========================================
     FOND
========================================= -->

<div class="background">

    <img
        id="backgroundImage"
        class="background-image"
        alt=""
    >

    <div
        class="background-overlay"
    ></div>

</div>



<!-- =========================================
     PLAYER
========================================= -->

<main class="stage">


    <section
        id="player"
        class="player"
    >


        <!-- POCHETTE -->

        <div
            class="cover-container"
        >

            <img
                id="cover"
                class="cover"
                alt="Pochette"
            >

        </div>



        <!-- INFORMATIONS -->

        <div class="info">


            <!-- TITRE -->

            <div
                id="title"
                class="title"
            >
                Aucun titre
            </div>



            <!-- ARTISTE -->

            <div
                id="artist"
                class="artist"
            >
                —
            </div>



            <div
                class="spacer"
            ></div>



            <!-- PROGRESSION -->

            <div
                class="progress-area"
            >


                <div
                    class="progress-track"
                >

                    <div
                        id="progressFill"
                        class="progress-fill"
                    ></div>


                    <div
                        id="progressKnob"
                        class="progress-knob"
                    ></div>

                </div>



                <!-- TEMPS -->

                <div
                    class="time-row"
                >

                    <span
                        id="currentTime"
                    >
                        0:00
                    </span>


                    <span
                        id="remainingTime"
                    >
                        -0:00
                    </span>

                </div>


            </div>


        </div>


    </section>


</main>



<script>

/* =========================================
   ÉLÉMENTS
========================================= */

const player = document.getElementById("player");

const cover = document.getElementById("cover");

const backgroundImage =
    document.getElementById(
        "backgroundImage"
    );

const title =
    document.getElementById(
        "title"
    );

const artist =
    document.getElementById(
        "artist"
    );

const progressFill =
    document.getElementById(
        "progressFill"
    );

const progressKnob =
    document.getElementById(
        "progressKnob"
    );

const currentTime =
    document.getElementById(
        "currentTime"
    );

const remainingTime =
    document.getElementById(
        "remainingTime"
    );


/* =========================================
   ÉTAT
========================================= */

let trackState = {

    title: "",

    artist: "",

    artwork: "",

    duration: 0,

    position: 0,

    receivedAt: Date.now(),

    playing: false

};


/* =========================================
   CONVERSION EN SECONDES
========================================= */

function toSeconds(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return 0;

    }


    const number =
        Number(value);


    if (
        !Number.isFinite(number)
    ) {

        return 0;

    }


    /*
     Si la valeur est très grande,
     on suppose qu'elle est en
     millisecondes.
    */

    if (
        number > 10000
    ) {

        return number / 1000;

    }


    return number;

}


/* =========================================
   FORMAT DU TEMPS
========================================= */

function formatTime(seconds) {

    seconds =
        Math.max(
            0,
            Math.floor(seconds || 0)
        );


    const minutes =
        Math.floor(
            seconds / 60
        );


    const remaining =
        seconds % 60;


    return (
        minutes
        + ":"
        + String(remaining)
            .padStart(2, "0")
    );

}


/* =========================================
   POSITION ACTUELLE
========================================= */

function getCurrentPosition() {

    let position =
        trackState.position;


    if (
        trackState.playing
    ) {

        const elapsed =
            (
                Date.now()
                -
                trackState.receivedAt
            )
            / 1000;


        position += elapsed;

    }


    if (
        trackState.duration > 0
    ) {

        position =
            Math.min(
                position,
                trackState.duration
            );

    }


    return Math.max(
        0,
        position
    );

}


/* =========================================
   MISE À JOUR PROGRESSION
========================================= */

function updateProgress() {

    const duration =
        trackState.duration;


    const position =
        getCurrentPosition();


    let percent = 0;


    if (
        duration > 0
    ) {

        percent =
            (
                position
                /
                duration
            )
            * 100;

    }


    percent =
        Math.max(
            0,
            Math.min(
                100,
                percent
            )
        );


    progressFill.style.width =
        percent + "%";


    progressKnob.style.left =
        percent + "%";


    currentTime.textContent =
        formatTime(position);


    const remaining =
        Math.max(
            0,
            duration - position
        );


    remainingTime.textContent =
        "-"
        + formatTime(remaining);

}


/* =========================================
   ANIMATION PROGRESSION
========================================= */

setInterval(

    updateProgress,

    500

);


/* =========================================
   CHARGEMENT IMAGE
========================================= */

function updateArtwork(url) {

    if (!url) {

        return;

    }


    /*
     Pochette principale
    */

    cover.classList.remove(
        "visible"
    );


    /*
     Fond flou
    */

    backgroundImage.classList.remove(
        "visible"
    );


    const preload =
        new Image();


    preload.onload = () => {


        cover.src =
            url;


        backgroundImage.src =
            url;


        requestAnimationFrame(
            () => {

                cover.classList.add(
                    "visible"
                );


                backgroundImage.classList.add(
                    "visible"
                );

            }
        );

    };


    preload.src =
        url;

}


/* =========================================
   EXTRACTION DES DONNÉES
========================================= */

function applyTrack(data) {

    if (!data) {

        return;

    }


    /*
     Compatibilité avec plusieurs
     noms de propriétés possibles.
    */

    const newTitle =
        data.title
        || "";


    const newArtist =
        data.artist
        || data.artists
        || "";


    const newArtwork =
        data.coverUrl
        || data.artwork
        || data.cover
        || data.image
        || "";


    const newDuration =
        toSeconds(

            data.duration
            ?? data.durationSeconds
            ?? data.length
            ?? 0

        );


    const newPosition =
        toSeconds(

            data.position
            ?? data.progress
            ?? data.currentTime
            ?? data.elapsed
            ?? 0

        );


    const isNewTrack =

        newTitle !==
            trackState.title

        ||

        newArtist !==
            trackState.artist

        ||

        newArtwork !==
            trackState.artwork;


    /*
     Texte
    */

    title.textContent =
        newTitle
        || "Aucun titre";


    artist.textContent =
        newArtist
        || "—";


    /*
     État lecture
    */

    const playingValue =

        data.playing
        ?? data.isPlaying
        ?? data.is_playing;


    trackState = {

        title:

            newTitle,

        artist:

            newArtist,

        artwork:

            newArtwork,

        duration:

            newDuration,

        position:

            newPosition,

        receivedAt:

            Date.now(),

        playing:

            playingValue === undefined
                ? true
                : Boolean(
                    playingValue
                )

    };


    /*
     Nouvelle pochette
    */

    if (
        isNewTrack
        &&
        newArtwork
    ) {

        updateArtwork(
            newArtwork
        );


        player.classList.remove(
            "changed"
        );


        void player.offsetWidth;


        player.classList.add(
            "changed"
        );

    }


    updateProgress();

}


/* =========================================
   RÉCUPÉRATION INITIALE
========================================= */

async function loadCurrentTrack() {

    try {

        const response =
            await fetch(
                "/api/now-playing"
            );


        if (
            !response.ok
        ) {

            return;

        }


        const data =
            await response.json();


        applyTrack(
            data
        );

    }

    catch (error) {

        console.log(
            "Impossible de récupérer la musique actuelle.",
            error
        );

    }

}


/* =========================================
   SSE ORPHEUS
========================================= */

function connectStream() {

    const stream =
        new EventSource(
            "/api/stream"
        );


    /*
     Événement track
    */

    stream.addEventListener(

        "track",

        event => {

            try {

                const data =
                    JSON.parse(
                        event.data
                    );


                applyTrack(
                    data
                );

            }

            catch (error) {

                console.log(
                    "Erreur données track.",
                    error
                );

            }

        }

    );


    /*
     Compatibilité avec
     un éventuel message générique
    */

    stream.onmessage = event => {

        try {

            const data =
                JSON.parse(
                    event.data
                );


            applyTrack(
                data
            );

        }

        catch {

            /* rien */

        }

    };


    stream.onerror = () => {

        /*
         EventSource tente normalement
         de se reconnecter seul.
        */

        console.log(
            "Reconnexion au flux Orpheus..."
        );

    };

}


/* =========================================
   DÉMARRAGE
========================================= */

loadCurrentTrack();

connectStream();

</script>

</body>
</html>
