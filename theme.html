<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111318;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    #player {
      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 30px;

      opacity: 0;
      transform: translateY(8px);

      transition:
        opacity 0.35s ease,
        transform 0.35s ease;
    }

    #player.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* POCHETTE — PLUS PETITE */

    #artwork-container {
      width: min(38vw, 420px);
      aspect-ratio: 1 / 1;

      overflow: hidden;
      border-radius: 16px;

      background: #1a1d24;

      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.5);
    }

    #artwork {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #artwork.loaded {
      opacity: 1;
    }


    /* INFORMATIONS */

    #info {
      width: min(45vw, 500px);

      margin-top: 18px;

      text-align: center;
    }

    #title {
      color: #ffffff;

      font-size: clamp(20px, 2vw, 30px);
      font-weight: 700;

      line-height: 1.2;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #artist {
      margin-top: 7px;

      color: #969ba5;

      font-size: clamp(15px, 1.4vw, 21px);
      font-weight: 400;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    @media (max-width: 700px) {

      #artwork-container {
        width: min(65vw, 360px);
      }

      #info {
        width: min(75vw, 400px);
      }

    }
  </style>
</head>


<body>

  <div id="player">

    <div id="artwork-container">
      <img id="artwork" alt="Pochette de l'album">
    </div>

    <div id="info">
      <div id="title">En attente...</div>
      <div id="artist"></div>
    </div>

  </div>


  <script>

    const player = document.getElementById('player');
    const artwork = document.getElementById('artwork');
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');


    let currentArtwork = '';


    function updateArtwork(url) {

      if (!url || url === currentArtwork) {
        return;
      }

      currentArtwork = url;

      artwork.classList.remove('loaded');

      const image = new Image();

      image.onload = () => {

        artwork.src = url;

        requestAnimationFrame(() => {
          artwork.classList.add('loaded');
        });

      };

      image.onerror = () => {
        console.error(
          'Impossible de charger la pochette :',
          url
        );
      };

      image.src = url;

    }


    function updateTrack(data) {

      if (!data) return;

      title.textContent =
        data.title || 'Titre inconnu';

      artist.textContent =
        data.artist || '';

      /*
        Compatibilité avec différentes
        versions d'Orpheus.
      */

      const cover =
        data.coverUrl ||
        data.artwork ||
        '';

      if (cover) {
        console.log(
          'URL de la pochette :',
          cover
        );

        updateArtwork(cover);
      }

      player.classList.add('visible');

    }


    /*
      Morceau actuel
    */

    fetch('/api/now-playing')
      .then(response => response.json())
      .then(updateTrack)
      .catch(error => {
        console.error(
          'Erreur :',
          error
        );
      });


    /*
      Changements en temps réel
    */

    const eventSource =
      new EventSource('/api/stream');


    eventSource.addEventListener(
      'track',
      event => {

        try {

          updateTrack(
            JSON.parse(event.data)
          );

        } catch (error) {

          console.error(
            'Erreur SSE :',
            error
          );

        }

      }
    );

  </script>

</body>
</html>
