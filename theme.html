<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;

      background: #000;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
    }


    /* =========================
       LECTEUR
    ========================= */

    #player {
      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 16px;
      padding: 24px;

      opacity: 0;
      transform: translateY(8px);

      transition:
        opacity 0.4s ease,
        transform 0.4s ease;
    }

    #player.visible {
      opacity: 1;
      transform: translateY(0);
    }


    /* =========================
       LIQUID GLASS SOMBRE
    ========================= */

    .glass {
      position: relative;

      /*
        Verre sombre :
        beaucoup moins clair
        que la version précédente.
      */

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.075),
          rgba(255, 255, 255, 0.025)
        );

      backdrop-filter:
        blur(28px)
        saturate(120%);

      -webkit-backdrop-filter:
        blur(28px)
        saturate(120%);

      border:
        1px solid
        rgba(255, 255, 255, 0.16);

      box-shadow:
        0 18px 45px
        rgba(0, 0, 0, 0.75),

        inset
        0 1px 0
        rgba(255, 255, 255, 0.06);
    }


    /*
      Reflet extrêmement discret.
    */

    .glass::before {
      content: "";

      position: absolute;
      inset: 0;

      border-radius: inherit;

      pointer-events: none;

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.035),
          transparent 30%,
          transparent 75%
        );
    }


    /* =========================
       PANNEAU POCHETTE
    ========================= */

    #artwork-panel {
      width: min(27vw, 310px);
      aspect-ratio: 1 / 1;

      padding: 18px;

      border-radius: 30px;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    /* =========================
       POCHETTE
    ========================= */

    #artwork {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      border-radius: 18px;

      opacity: 0;

      transform: scale(0.98);

      transition:
        opacity 0.4s ease,
        transform 0.4s ease;

      box-shadow:
        0 10px 25px
        rgba(0, 0, 0, 0.55);
    }

    #artwork.loaded {
      opacity: 1;
      transform: scale(1);
    }


    /* =========================
       PANNEAU INFORMATIONS
    ========================= */

    #info-panel {
      width: min(27vw, 310px);

      border-radius: 26px;

      padding:
        20px
        22px
        18px;

      text-align: center;
    }


    /* =========================
       TITRE
    ========================= */

    #title {
      color: #fff;

      font-size:
        clamp(18px, 1.6vw, 25px);

      font-weight: 700;

      letter-spacing: -0.02em;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* =========================
       ARTISTE
    ========================= */

    #artist {
      margin-top: 6px;

      color:
        rgba(255, 255, 255, 0.55);

      font-size:
        clamp(14px, 1.1vw, 17px);

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* =========================
       PROGRESSION
    ========================= */

    #progress-container {
      margin-top: 18px;

      width: 100%;
    }


    /* BARRE DE FOND */

    #progress-track {
      position: relative;

      width: 100%;
      height: 4px;

      border-radius: 999px;

      background:
        rgba(255, 255, 255, 0.16);

      overflow: visible;
    }


    /* PARTIE ÉCOULÉE */

    #progress-fill {
      width: 0%;
      height: 100%;

      border-radius: inherit;

      background:
        rgba(255, 255, 255, 0.88);

      transition:
        width 0.5s linear;
    }


    /* CURSEUR */

    #progress-thumb {
      position: absolute;

      top: 50%;
      left: 0%;

      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #fff;

      transform:
        translate(-50%, -50%);

      box-shadow:
        0 0 8px
        rgba(255, 255, 255, 0.35);

      transition:
        left 0.5s linear;
    }


    /* =========================
       TEMPS
    ========================= */

    #time-row {
      display: flex;

      justify-content: space-between;

      margin-top: 8px;

      color:
        rgba(255, 255, 255, 0.48);

      font-size: 12px;

      font-variant-numeric:
        tabular-nums;
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 900px) {

      #artwork-panel,
      #info-panel {
        width: min(42vw, 310px);
      }

    }


    @media (max-width: 600px) {

      #player {
        gap: 14px;
      }

      #artwork-panel {
        width: min(70vw, 290px);

        padding: 16px;

        border-radius: 26px;
      }

      #info-panel {
        width: min(70vw, 290px);
      }

    }

  </style>
</head>


<body>

  <div id="player">


    <!-- PANNEAU POCHETTE -->

    <div
      id="artwork-panel"
      class="glass"
    >

      <img
        id="artwork"
        src=""
        alt="Pochette"
      >

    </div>



    <!-- PANNEAU INFORMATIONS -->

    <div
      id="info-panel"
      class="glass"
    >


      <!-- TITRE -->

      <div id="title">
        En attente...
      </div>


      <!-- ARTISTE -->

      <div id="artist"></div>



      <!-- PROGRESSION -->

      <div id="progress-container">

        <div id="progress-track">

          <div id="progress-fill"></div>

          <div id="progress-thumb"></div>

        </div>


        <!-- TEMPS -->

        <div id="time-row">

          <span id="current-time">
            0:00
          </span>

          <span id="duration">
            0:00
          </span>

        </div>

      </div>


    </div>

  </div>



  <script>

    /* =========================
       ÉLÉMENTS
    ========================= */

    const player =
      document.getElementById('player');

    const artwork =
      document.getElementById('artwork');

    const title =
      document.getElementById('title');

    const artist =
      document.getElementById('artist');

    const progressFill =
      document.getElementById('progress-fill');

    const progressThumb =
      document.getElementById('progress-thumb');

    const currentTimeElement =
      document.getElementById('current-time');

    const durationElement =
      document.getElementById('duration');


    /* =========================
       DONNÉES ACTUELLES
    ========================= */

    let currentArtwork = '';

    let currentPosition = 0;

    let currentDuration = 0;

    let lastUpdate = Date.now();


    /* =========================
       FORMAT TEMPS
    ========================= */

    function formatTime(seconds) {

      seconds =
        Math.max(
          0,
          Math.floor(seconds || 0)
        );

      const minutes =
        Math.floor(seconds / 60);

      const remainingSeconds =
        seconds % 60;

      return (
        minutes +
        ':' +
        String(remainingSeconds).padStart(
          2,
          '0'
        )
      );

    }


    /* =========================
       POCHETTE
    ========================= */

    function updateArtwork(url) {

      if (
        !url ||
        url === currentArtwork
      ) {
        return;
      }


      currentArtwork = url;

      artwork.classList.remove('loaded');


      const image =
        new Image();


      image.onload = () => {

        artwork.src = url;


        requestAnimationFrame(() => {

          artwork.classList.add(
            'loaded'
          );

        });

      };


      image.src = url;

    }


    /* =========================
       PROGRESSION
    ========================= */

    function updateProgress() {

      let percentage = 0;


      if (currentDuration > 0) {

        percentage =
          Math.min(
            100,
            Math.max(
              0,
              (
                currentPosition /
                currentDuration
              ) * 100
            )
          );

      }


      progressFill.style.width =
        percentage + '%';


      progressThumb.style.left =
        percentage + '%';


      currentTimeElement.textContent =
        formatTime(
          currentPosition
        );


      durationElement.textContent =
        formatTime(
          currentDuration
        );

    }


    /* =========================
       MISE À JOUR MORCEAU
    ========================= */

    function updateTrack(data) {

      if (!data) return;


      title.textContent =
        data.title ||
        'Titre inconnu';


      artist.textContent =
        data.artist ||
        '';


      const cover =

        data.coverUrl ||

        data.artwork ||

        '';


      if (cover) {

        updateArtwork(
          cover
        );

      }


      /*
        Position actuelle.

        Plusieurs noms possibles
        sont testés.
      */

      const position =

        data.position ??

        data.currentTime ??

        data.elapsed ??

        data.progress ??

        0;


      /*
        Durée totale.

        Plusieurs noms possibles
        sont testés.
      */

      const duration =

        data.duration ??

        data.totalDuration ??

        data.length ??

        0;


      /*
        Mise à jour uniquement
        si les données existent.
      */

      if (
        duration > 0
      ) {

        currentPosition =
          Number(position) || 0;

        currentDuration =
          Number(duration) || 0;

        lastUpdate =
          Date.now();

        updateProgress();

      }


      player.classList.add(
        'visible'
      );

    }


    /* =========================
       ANIMATION DE LA BARRE
    ========================= */

    setInterval(() => {

      if (
        currentDuration > 0
      ) {

        const now =
          Date.now();


        const elapsedSeconds =

          (now - lastUpdate)
          / 1000;


        const estimatedPosition =

          currentPosition +
          elapsedSeconds;


        if (
          estimatedPosition <=
          currentDuration
        ) {

          currentPosition =
            estimatedPosition;

          lastUpdate =
            now;

          updateProgress();

        }

      }

    }, 1000);


    /* =========================
       CHARGEMENT INITIAL
    ========================= */

    fetch('/api/now-playing')

      .then(
        response =>
          response.json()
      )

      .then(
        updateTrack
      )

      .catch(
        error => {

          console.error(
            'Erreur now-playing :',
            error
          );

        }
      );


    /* =========================
       STREAM EN DIRECT
    ========================= */

    function connectStream() {

      const eventSource =
        new EventSource(
          '/api/stream'
        );


      eventSource.addEventListener(

        'track',

        event => {

          try {

            const data =
              JSON.parse(
                event.data
              );


            updateTrack(
              data
            );

          }

          catch (error) {

            console.error(
              'Erreur SSE :',
              error
            );

          }

        }

      );


      eventSource.onerror = () => {

        eventSource.close();


        setTimeout(
          connectStream,
          2000
        );

      };

    }


    connectStream();

  </script>

</body>
</html>
