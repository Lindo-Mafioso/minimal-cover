<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;

      background: #111318;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #player {
      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      padding: 60px;

      opacity: 0;
      transform: translateY(15px);

      transition:
        opacity 0.45s ease,
        transform 0.45s ease;
    }

    #player.visible {
      opacity: 1;
      transform: translateY(0);
    }


    /* =========================
       POCHETTE
    ========================= */

    #artwork-container {
      width: min(62vw, 700px);
      aspect-ratio: 1 / 1;

      overflow: hidden;

      border-radius: 22px;

      background: #1a1d24;

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.55);
    }

    #artwork {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      image-rendering: auto;

      opacity: 0;

      transform: scale(1.03);

      transition:
        opacity 0.45s ease,
        transform 0.7s ease;
    }

    #artwork.loaded {
      opacity: 1;
      transform: scale(1);
    }


    /* =========================
       INFORMATIONS
    ========================= */

    #info {
      width: min(62vw, 700px);

      margin-top: 32px;

      text-align: center;
    }

    #title {
      color: #ffffff;

      font-size: clamp(28px, 3vw, 48px);

      font-weight: 750;

      line-height: 1.15;

      letter-spacing: -0.02em;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #artist {
      margin-top: 12px;

      color: #a8adb8;

      font-size: clamp(19px, 2vw, 30px);

      font-weight: 400;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* =========================
       RESPONSIVE PETITS ÉCRANS
    ========================= */

    @media (max-width: 700px) {

      #player {
        padding: 30px;
      }

      #artwork-container,
      #info {
        width: min(88vw, 600px);
      }

    }

  </style>
</head>


<body>

  <div id="player">

    <div id="artwork-container">

      <img
        id="artwork"
        src=""
        alt="Pochette de l'album"
      >

    </div>


    <div id="info">

      <div id="title">
        En attente...
      </div>

      <div id="artist"></div>

    </div>

  </div>


  <script>

    const player = document.getElementById('player');
    const artwork = document.getElementById('artwork');
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');


    /*
      Améliore la résolution des URLs Deezer
      lorsque l'URL contient déjà une taille.
    */

    function getHighResolutionArtwork(url) {

      if (!url) return '';

      /*
        Exemple Deezer :

        .../250x250-000000-80-0-0.jpg

        devient :

        .../1200x1200-000000-80-0-0.jpg
      */

      if (
        url.includes('dzcdn.net') ||
        url.includes('deezer')
      ) {

        return url.replace(
          /\/\d+x\d+([-.])/,
          '/1200x1200$1'
        );

      }

      return url;

    }


    function updateArtwork(url) {

      if (!url) return;

      artwork.classList.remove('loaded');

      const highResUrl =
        getHighResolutionArtwork(url);


      /*
        Précharge l'image avant de l'afficher
        pour éviter un changement brutal.
      */

      const image = new Image();

      image.onload = () => {

        artwork.src = highResUrl;

        requestAnimationFrame(() => {
          artwork.classList.add('loaded');
        });

      };


      /*
        Si la version haute résolution
        ne fonctionne pas, on utilise
        l'URL originale.
      */

      image.onerror = () => {

        artwork.src = url;

        requestAnimationFrame(() => {
          artwork.classList.add('loaded');
        });

      };


      image.src = highResUrl;

    }


    function updateTrack(data) {

      if (!data) return;


      title.textContent =
        data.title || 'Titre inconnu';


      artist.textContent =
        data.artist || '';


      /*
        Compatible avec les différentes
        versions possibles d'Orpheus.
      */

      const cover =
        data.coverUrl ||
        data.artwork ||
        '';


      if (cover) {
        updateArtwork(cover);
      }


      player.classList.add('visible');

    }


    /*
      Chargement immédiat
      du morceau actuellement joué.
    */

    fetch('/api/now-playing')

      .then(response => response.json())

      .then(data => {
        updateTrack(data);
      })

      .catch(error => {
        console.error(
          'Erreur now-playing :',
          error
        );
      });


    /*
      Mises à jour en temps réel.
    */

    function connectStream() {

      const eventSource =
        new EventSource('/api/stream');


      eventSource.addEventListener(
        'track',
        event => {

          try {

            const data =
              JSON.parse(event.data);

            updateTrack(data);

          }

          catch (error) {

            console.error(
              'Erreur SSE :',
              error
            );

          }

        }
      );


      eventSource.onerror = () => {

        eventSource.close();

        setTimeout(
          connectStream,
          2000
        );

      };

    }


    connectStream();

  </script>

</body>
</html>
