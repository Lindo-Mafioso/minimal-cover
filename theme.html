<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    #player {
      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 30px;

      opacity: 0;
      transform: translateY(15px);

      transition:
        opacity 0.4s ease,
        transform 0.4s ease;
    }

    #player.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #artwork-container {
      width: min(80vw, 600px);
      aspect-ratio: 1 / 1;

      overflow: hidden;
      border-radius: 18px;

      box-shadow:
        0 15px 50px rgba(0, 0, 0, 0.35);
    }

    #artwork {
      width: 100%;
      height: 100%;

      object-fit: cover;
      display: block;

      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
    }

    #info {
      width: min(80vw, 600px);
      text-align: center;
      margin-top: 22px;
      color: white;
    }

    #title {
      font-size: clamp(22px, 2.5vw, 36px);
      font-weight: 700;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.5);
    }

    #artist {
      margin-top: 8px;

      font-size: clamp(16px, 1.8vw, 24px);
      font-weight: 400;

      opacity: 0.7;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>

<body>

  <div id="player">

    <div id="artwork-container">
      <img id="artwork" src="" alt="Pochette">
    </div>

    <div id="info">
      <div id="title">En attente...</div>
      <div id="artist"></div>
    </div>

  </div>

  <script>

    const player = document.getElementById('player');
    const artwork = document.getElementById('artwork');
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');


    function updateTrack(data) {

      if (!data) {
        return;
      }

      title.textContent = data.title || 'Titre inconnu';
      artist.textContent = data.artist || '';

      if (data.coverUrl) {
        artwork.src = data.coverUrl;
      }

      player.classList.add('visible');
    }


    // Charge immédiatement le morceau en cours
    fetch('/api/now-playing')
      .then(response => response.json())
      .then(updateTrack)
      .catch(error => console.error(error));


    // Écoute les changements de morceau en temps réel
    function connectSSE() {

      const eventSource = new EventSource('/api/stream');

      eventSource.addEventListener('track', (event) => {
        try {
          const data = JSON.parse(event.data);
          updateTrack(data);
        } catch (error) {
          console.error('Erreur de lecture des données :', error);
        }
      });

      eventSource.onerror = () => {
        eventSource.close();
        setTimeout(connectSSE, 2000);
      };
    }

    connectSSE();

  </script>

</body>
</html>
