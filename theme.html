<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <style>

    /* ========================================
       BASE
    ======================================== */

    * {
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #090909;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;

      color: white;
    }


    /* ========================================
       FOND FLOUTÉ
    ======================================== */

    #background {

      position: fixed;

      /*
        On dépasse volontairement
        de l'écran pour éviter
        les bords blancs causés
        par le flou.
      */

      top: -10%;
      left: -10%;

      width: 120%;
      height: 120%;

      background-image: none;

      background-size: cover;
      background-position: center;

      filter:
        blur(45px)
        saturate(120%);

      transform: scale(1.12);

      opacity: 0.72;

      transition:
        background-image 0.8s ease,
        opacity 0.8s ease;

      z-index: 0;
    }


    /* ========================================
       COUCHE SOMBRE
    ======================================== */

    #overlay {

      position: fixed;

      inset: 0;

      background:

        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.30),
          rgba(0, 0, 0, 0.58)
        );

      backdrop-filter:
        blur(3px);

      -webkit-backdrop-filter:
        blur(3px);

      z-index: 1;
    }


    /* ========================================
       VIGNETTE

       Assombrit légèrement
       les bords de l'écran.
    ======================================== */

    #vignette {

      position: fixed;

      inset: 0;

      pointer-events: none;

      background:

        radial-gradient(
          ellipse at center,
          transparent 35%,
          rgba(0, 0, 0, 0.42) 100%
        );

      z-index: 2;
    }


    /* ========================================
       PLAYER
    ======================================== */

    #player {

      position: relative;

      z-index: 3;

      width: 100%;
      height: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      padding: 40px;

      opacity: 0;

      transform:
        translateY(12px);

      transition:
        opacity 0.5s ease,
        transform 0.5s ease;
    }


    #player.visible {

      opacity: 1;

      transform:
        translateY(0);

    }


    /* ========================================
       CONTENEUR PRINCIPAL
    ======================================== */

    #content {

      width:
        min(
          90vw,
          520px
        );

      display: flex;

      flex-direction: column;

      align-items: center;

    }


    /* ========================================
       POCHETTE
    ======================================== */

    #artwork-container {

      width:
        min(
          58vw,
          390px
        );

      aspect-ratio: 1 / 1;

      border-radius: 24px;

      overflow: hidden;

      background:
        rgba(0, 0, 0, 0.25);

      box-shadow:

        0 25px 60px
        rgba(0, 0, 0, 0.48),

        0 2px 10px
        rgba(0, 0, 0, 0.25);

      border:

        1px solid
        rgba(255, 255, 255, 0.16);

    }


    #artwork {

      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      opacity: 0;

      transform:
        scale(1.03);

      transition:

        opacity 0.5s ease,

        transform 0.7s ease;

    }


    #artwork.loaded {

      opacity: 1;

      transform:
        scale(1);

    }


    /* ========================================
       INFORMATIONS
    ======================================== */

    #info {

      width: 100%;

      margin-top: 28px;

      text-align: center;

    }


    /* ========================================
       TITRE
    ======================================== */

    #title {

      color: white;

      font-size:

        clamp(
          23px,
          3vw,
          34px
        );

      font-weight: 700;

      line-height: 1.15;

      letter-spacing:
        -0.03em;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      text-shadow:

        0 2px 14px
        rgba(0, 0, 0, 0.35);

    }


    /* ========================================
       ARTISTE
    ======================================== */

    #artist {

      margin-top: 8px;

      color:

        rgba(
          255,
          255,
          255,
          0.72
        );

      font-size:

        clamp(
          16px,
          1.8vw,
          21px
        );

      font-weight: 400;

      letter-spacing:
        -0.01em;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      text-shadow:

        0 2px 12px
        rgba(0, 0, 0, 0.3);

    }


    /* ========================================
       PROGRESSION
    ======================================== */

    #progress-container {

      width: 100%;

      margin-top: 30px;

    }


    /* BARRE */

    #progress-track {

      position: relative;

      width: 100%;

      height: 4px;

      border-radius: 999px;

      background:

        rgba(
          255,
          255,
          255,
          0.26
        );

      overflow: visible;

    }


    /* PARTIE ÉCOULÉE */

    #progress-fill {

      width: 0%;

      height: 100%;

      border-radius: inherit;

      background:

        rgba(
          255,
          255,
          255,
          0.92
        );

      transition:

        width 0.4s linear;

    }


    /* CURSEUR */

    #progress-thumb {

      position: absolute;

      top: 50%;
      left: 0%;

      width: 11px;
      height: 11px;

      border-radius: 50%;

      background: white;

      transform:

        translate(
          -50%,
          -50%
        );

      box-shadow:

        0 2px 8px
        rgba(0, 0, 0, 0.35);

      transition:

        left 0.4s linear;

    }


    /* ========================================
       TEMPS
    ======================================== */

    #time-row {

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      margin-top: 10px;

      color:

        rgba(
          255,
          255,
          255,
          0.68
        );

      font-size: 13px;

      font-weight: 400;

      font-variant-numeric:

        tabular-nums;

    }


    /* ========================================
       PETITS ÉCRANS
    ======================================== */

    @media (
      max-width: 700px
    ) {

      #player {

        padding:
          30px
          24px;

      }


      #artwork-container {

        width:

          min(
            78vw,
            360px
          );

      }


      #info {

        margin-top: 22px;

      }


      #progress-container {

        margin-top: 24px;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================
       FOND
  ====================================== -->

  <div
    id="background"
  ></div>


  <div
    id="overlay"
  ></div>


  <div
    id="vignette"
  ></div>



  <!-- =====================================
       PLAYER
  ====================================== -->

  <main
    id="player"
  >

    <div
      id="content"
    >


      <!-- =================================
           POCHETTE
      ================================== -->

      <div
        id="artwork-container"
      >

        <img
          id="artwork"
          src=""
          alt="Pochette de l'album"
        >

      </div>



      <!-- =================================
           INFORMATIONS
      ================================== -->

      <div
        id="info"
      >


        <div
          id="title"
        >
          En attente...
        </div>


        <div
          id="artist"
        ></div>



        <!-- =============================
             PROGRESSION
        ============================== -->

        <div
          id="progress-container"
        >


          <div
            id="progress-track"
          >

            <div
              id="progress-fill"
            ></div>


            <div
              id="progress-thumb"
            ></div>

          </div>



          <!-- ===========================
               TEMPS
          ============================ -->

          <div
            id="time-row"
          >

            <span
              id="current-time"
            >
              0:00
            </span>


            <span
              id="duration"
            >
              0:00
            </span>

          </div>


        </div>


      </div>


    </div>


  </main>



  <script>


    /* =====================================
       ÉLÉMENTS
    ====================================== */

    const player =
      document.getElementById(
        'player'
      );


    const background =
      document.getElementById(
        'background'
      );


    const artwork =
      document.getElementById(
        'artwork'
      );


    const title =
      document.getElementById(
        'title'
      );


    const artist =
      document.getElementById(
        'artist'
      );


    const progressFill =
      document.getElementById(
        'progress-fill'
      );


    const progressThumb =
      document.getElementById(
        'progress-thumb'
      );


    const currentTimeElement =
      document.getElementById(
        'current-time'
      );


    const durationElement =
      document.getElementById(
        'duration'
      );



    /* =====================================
       ÉTAT ACTUEL
    ====================================== */

    let currentArtwork = '';

    let trackPosition = 0;

    let trackDuration = 0;

    let positionUpdatedAt =
      Date.now();



    /* =====================================
       NORMALISATION DES SECONDES

       Certains systèmes peuvent envoyer
       des millisecondes.
    ====================================== */

    function normalizeTime(value) {

      const number =
        Number(value) || 0;


      /*
        Si la valeur est très grande,
        on suppose qu'elle est
        en millisecondes.
      */

      if (number > 10000) {

        return number / 1000;

      }


      return number;

    }



    /* =====================================
       FORMAT DU TEMPS
    ====================================== */

    function formatTime(seconds) {

      seconds =
        Math.max(
          0,
          Math.floor(
            seconds || 0
          )
        );


      const minutes =
        Math.floor(
          seconds / 60
        );


      const remainingSeconds =
        seconds % 60;


      return (

        minutes

        +

        ':'

        +

        String(
          remainingSeconds
        ).padStart(
          2,
          '0'
        )

      );

    }



    /* =====================================
       CHARGEMENT DE LA POCHETTE
    ====================================== */

    function updateArtwork(url) {

      if (
        !url ||
        url === currentArtwork
      ) {

        return;

      }


      currentArtwork = url;


      artwork.classList.remove(
        'loaded'
      );


      const image =
        new Image();


      image.onload = () => {


        /*
          Image principale
        */

        artwork.src = url;


        /*
          Même image pour
          le fond flouté.
        */

        background.style.backgroundImage =

          `url("${url}")`;


        requestAnimationFrame(
          () => {

            artwork.classList.add(
              'loaded'
            );

          }
        );


      };


      image.onerror = () => {

        console.error(
          'Impossible de charger la pochette.'
        );

      };


      image.src = url;

    }



    /* =====================================
       POSITION ACTUELLE
    ====================================== */

    function getCurrentPosition() {

      if (
        trackDuration <= 0
      ) {

        return 0;

      }


      const elapsed =

        (
          Date.now()
          -
          positionUpdatedAt
        )

        / 1000;


      return Math.min(

        trackDuration,

        trackPosition
        +
        elapsed

      );

    }



    /* =====================================
       AFFICHAGE PROGRESSION
    ====================================== */

    function renderProgress() {

      const position =
        getCurrentPosition();


      let percentage = 0;


      if (
        trackDuration > 0
      ) {

        percentage =

          Math.min(

            100,

            Math.max(

              0,

              (
                position
                /
                trackDuration
              )

              *
              100

            )

          );

      }


      progressFill.style.width =

        percentage + '%';


      progressThumb.style.left =

        percentage + '%';


      currentTimeElement.textContent =

        formatTime(
          position
        );


      durationElement.textContent =

        formatTime(
          trackDuration
        );

    }



    /* =====================================
       MISE À JOUR DU MORCEAU
    ====================================== */

    function updateTrack(data) {

      if (!data) {

        return;

      }


      /* TITRE */

      title.textContent =

        data.title

        ||

        'Titre inconnu';



      /* ARTISTE */

      artist.textContent =

        data.artist

        ||

        '';



      /* POCHETTE */

      const cover =

        data.coverUrl

        ||

        data.artwork

        ||

        '';


      if (cover) {

        updateArtwork(
          cover
        );

      }



      /* =================================
         POSITION

         Plusieurs noms sont testés
         pour rester compatible.
      ================================== */

      const rawPosition =

        data.position

        ??

        data.currentTime

        ??

        data.elapsed

        ??

        data.progress

        ??

        0;



      /* =================================
         DURÉE
      ================================== */

      const rawDuration =

        data.duration

        ??

        data.totalDuration

        ??

        data.length

        ??

        0;


      const newDuration =

        normalizeTime(
          rawDuration
        );


      const newPosition =

        normalizeTime(
          rawPosition
        );


      if (
        newDuration > 0
      ) {

        trackDuration =
          newDuration;


        trackPosition =
          newPosition;


        positionUpdatedAt =
          Date.now();


        renderProgress();

      }



      /* AFFICHAGE */

      player.classList.add(
        'visible'
      );

    }



    /* =====================================
       ANIMATION DE LA PROGRESSION
    ====================================== */

    setInterval(

      renderProgress,

      500

    );



    /* =====================================
       CHARGEMENT INITIAL
    ====================================== */

    fetch(
      '/api/now-playing'
    )

      .then(

        response =>

          response.json()

      )

      .then(

        data => {

          updateTrack(
            data
          );

        }

      )

      .catch(

        error => {

          console.error(

            'Erreur now-playing :',

            error

          );

        }

      );



    /* =====================================
       FLUX EN DIRECT
    ====================================== */

    function connectStream() {


      const eventSource =

        new EventSource(
          '/api/stream'
        );



      eventSource.addEventListener(

        'track',

        event => {

          try {


            const data =

              JSON.parse(
                event.data
              );


            updateTrack(
              data
            );


          }

          catch (error) {

            console.error(

              'Erreur du flux :',

              error

            );

          }

        }

      );



      /* =================================
         RECONNEXION
      ================================== */

      eventSource.onerror = () => {

        eventSource.close();


        setTimeout(

          connectStream,

          2000

        );

      };

    }



    connectStream();


  </script>


</body>
</html>
