<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    /* =========================
       BASE
    ========================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #000000;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Arial,
        sans-serif;
    }


    /* =========================
       LECTEUR
    ========================= */

    #player {
      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 18px;

      padding: 24px;

      opacity: 0;

      transform: translateY(10px);

      transition:
        opacity 0.45s ease,
        transform 0.45s ease;
    }

    #player.visible {
      opacity: 1;
      transform: translateY(0);
    }


    /* =========================
       EFFET VERRE
    ========================= */

    .glass {
      position: relative;

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.10),
          rgba(255, 255, 255, 0.035)
        );

      backdrop-filter:
        blur(24px)
        saturate(130%);

      -webkit-backdrop-filter:
        blur(24px)
        saturate(130%);

      border:
        1px solid
        rgba(255, 255, 255, 0.22);

      box-shadow:
        0 20px 50px
        rgba(0, 0, 0, 0.55),

        inset
        0 1px 0
        rgba(255, 255, 255, 0.08);
    }


    /*
      Reflet très discret.
    */

    .glass::before {
      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      border-radius: inherit;

      background:
        linear-gradient(
          125deg,
          rgba(255, 255, 255, 0.06),
          transparent 32%,
          transparent 70%,
          rgba(255, 255, 255, 0.015)
        );
    }


    /* =========================
       PANNEAU POCHETTE
    ========================= */

    #artwork-panel {
      width: min(27vw, 310px);

      aspect-ratio: 1 / 1;

      padding: 20px;

      border-radius: 30px;

      display: flex;

      align-items: center;
      justify-content: center;
    }


    /* =========================
       POCHETTE
    ========================= */

    #artwork {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      border-radius: 18px;

      opacity: 0;

      transform: scale(0.98);

      transition:
        opacity 0.45s ease,
        transform 0.45s ease;

      box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.45);
    }


    #artwork.loaded {
      opacity: 1;

      transform: scale(1);
    }


    /* =========================
       PANNEAU INFORMATIONS
    ========================= */

    #info-panel {
      width: min(27vw, 310px);

      min-height: 120px;

      border-radius: 28px;

      padding:
        22px
        24px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      text-align: center;
    }


    /* =========================
       TITRE
    ========================= */

    #title {
      color: #ffffff;

      font-size:
        clamp(
          19px,
          1.65vw,
          26px
        );

      font-weight: 700;

      letter-spacing: -0.02em;

      line-height: 1.2;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      text-shadow:
        0 1px 10px
        rgba(255, 255, 255, 0.08);
    }


    /* =========================
       ARTISTE
    ========================= */

    #artist {
      margin-top: 7px;

      color:
        rgba(
          255,
          255,
          255,
          0.58
        );

      font-size:
        clamp(
          14px,
          1.15vw,
          18px
        );

      font-weight: 400;

      letter-spacing: -0.01em;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 900px) {

      #artwork-panel,
      #info-panel {
        width:
          min(
            42vw,
            310px
          );
      }

    }


    @media (max-width: 600px) {

      #player {
        gap: 14px;
      }


      #artwork-panel {
        width:
          min(
            70vw,
            300px
          );

        padding: 16px;

        border-radius: 26px;
      }


      #info-panel {
        width:
          min(
            70vw,
            300px
          );

        min-height: 105px;

        padding:
          18px
          20px;

        border-radius: 24px;
      }


      #artwork {
        border-radius: 15px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       LECTEUR
  ========================== -->

  <div id="player">


    <!-- =====================
         PANNEAU POCHETTE
    ====================== -->

    <div
      id="artwork-panel"
      class="glass"
    >

      <img
        id="artwork"
        src=""
        alt="Pochette de l'album"
      >

    </div>



    <!-- =====================
         PANNEAU INFORMATIONS
    ====================== -->

    <div
      id="info-panel"
      class="glass"
    >

      <div id="title">
        En attente...
      </div>

      <div id="artist"></div>

    </div>


  </div>



  <script>

    /* =========================
       ÉLÉMENTS
    ========================= */

    const player =
      document.getElementById(
        'player'
      );


    const artwork =
      document.getElementById(
        'artwork'
      );


    const title =
      document.getElementById(
        'title'
      );


    const artist =
      document.getElementById(
        'artist'
      );



    /* =========================
       MÉMOIRE POCHETTE
    ========================= */

    let currentArtwork = '';



    /* =========================
       MISE À JOUR POCHETTE
    ========================= */

    function updateArtwork(url) {

      if (
        !url ||
        url === currentArtwork
      ) {
        return;
      }


      currentArtwork = url;


      artwork.classList.remove(
        'loaded'
      );


      const image =
        new Image();


      image.onload = () => {

        artwork.src = url;


        requestAnimationFrame(
          () => {

            artwork.classList.add(
              'loaded'
            );

          }
        );

      };


      image.onerror = () => {

        console.error(
          'Impossible de charger la pochette.'
        );

      };


      image.src = url;

    }



    /* =========================
       MISE À JOUR MORCEAU
    ========================= */

    function updateTrack(data) {

      if (!data) {
        return;
      }


      title.textContent =
        data.title ||
        'Titre inconnu';


      artist.textContent =
        data.artist ||
        '';


      /*
        Compatibilité
        coverUrl / artwork
      */

      const cover =

        data.coverUrl ||

        data.artwork ||

        '';


      if (cover) {

        updateArtwork(
          cover
        );

      }


      player.classList.add(
        'visible'
      );

    }



    /* =========================
       CHARGEMENT INITIAL
    ========================= */

    fetch(
      '/api/now-playing'
    )

      .then(
        response =>
          response.json()
      )

      .then(
        data => {

          updateTrack(data);

        }
      )

      .catch(
        error => {

          console.error(
            'Erreur now-playing :',
            error
          );

        }
      );



    /* =========================
       FLUX EN DIRECT
    ========================= */

    function connectStream() {

      const eventSource =

        new EventSource(
          '/api/stream'
        );


      eventSource.addEventListener(

        'track',

        event => {

          try {

            const data =

              JSON.parse(
                event.data
              );


            updateTrack(
              data
            );

          }

          catch (error) {

            console.error(
              'Erreur SSE :',
              error
            );

          }

        }

      );


      /*
        Reconnexion automatique
      */

      eventSource.onerror = () => {

        eventSource.close();


        setTimeout(

          connectStream,

          2000

        );

      };

    }


    connectStream();

  </script>

</body>
</html>
